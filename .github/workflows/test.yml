name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + test deps
        run: uv sync --extra dev

      - name: Pre-cache HF model so first retrieve does not time out
        run: |
          uv run python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run pytest with coverage
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
        run: |
          uv run coverage run -m pytest tests/ --ignore=tests/test_encryption.py -q
          uv run coverage report --include="mnemonics/*.py" --omit="mnemonics/migrate.py" --fail-under=100

      - name: Lint
        run: uv run ruff check mnemonics/

      - name: Type check
        run: |
          uv run mypy mnemonics/store.py mnemonics/retrieve.py mnemonics/ingest.py mnemonics/server.py mnemonics/backup.py mnemonics/sync.py --ignore-missing-imports

      - name: Upload coverage XML
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
