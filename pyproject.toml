[project]
name = "mnemonics"
version = "0.3.0"
description = "Local-first AI memory — semantic retrieval over your own SQLite + HNSW index."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "atakan" }]
keywords = ["llm", "memory", "retrieval", "rag", "mcp", "agent", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "numpy>=1.24",
  "hnswlib>=0.8",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
encrypt = ["sqlcipher3>=0.5", "keyring>=24"]

[project.scripts]
mnemonics = "mnemonics.cli:main"
mnem = "mnemonics.cli:main"

[project.urls]
Homepage = "https://github.com/nakata-app/mnemonics"
Repository = "https://github.com/nakata-app/mnemonics"
Issues = "https://github.com/nakata-app/mnemonics/issues"
Changelog = "https://github.com/nakata-app/mnemonics/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemonics*"]
exclude = ["tests*", "benchmarks*", "claude_hooks*", "dist*"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.3",
    "mypy>=1.10",
    "hypothesis>=6.155.3",
    "ruff>=0.15.12",
]

[tool.coverage.run]
source = ["mnemonics"]
omit = ["mnemonics/migrate.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 100

[tool.mypy]
ignore_missing_imports = true
files = [
    "mnemonics/store.py",
    "mnemonics/retrieve.py",
    "mnemonics/ingest.py",
    "mnemonics/server.py",
    "mnemonics/backup.py",
    "mnemonics/sync.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'mnemonics.cli' found in sys.modules:RuntimeWarning",
]
